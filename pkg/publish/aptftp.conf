// Configuration for apt-ftparchive, brought across from
// /home/pgaupload/aptftp.conf on the download server so that it is version
// controlled alongside the scripts that use it.
//
// Architectures is overridden on the apt-ftparchive command line by
// rebuild-apt-repo.sh, from the same list it indexes, so that the set of
// architectures indexed and the set advertised in the signed Release file
// cannot disagree. The value here is the default that override supplies.

APT::FTPArchive::Release {
  Origin "pgAdmin Development Team";
  Label "pgAdmin 4";
  Suite "pgadmin4";
  Architectures "amd64 all";
  Components "main";
  Description "pgAdmin 4 - Development Tools for PostgreSQL";
};
Default {
        Packages::Compress ". gzip bzip2";
        Sources::Compress ". gzip bzip2";
        Contents::Compress ". gzip bzip2";
};
