# Throwaway spike. NOT part of CI, and not wired to push or pull_request.
#
# One question: does `make appbundle` fit inside a GitHub-hosted macOS runner?
# The arm64 images have 3 vCPU and 7 GB of RAM, against the 8 cores and 16 GiB
# of the mac2.metal buildfarm worker they would replace, and the comment at
# pkg/mac/build-functions.sh:320 records webpack being OS-OOM-killed inside
# TerserPlugin on a Mac builder at a 3 GB old-space ceiling, with 6 GB then
# starving the earlier steps. Nothing in the existing workflows runs a
# production webpack bundle on macOS, so that history is untested here.
#
# The build runs unsigned: pkg/mac/build.sh sets CODESIGN=0 and NOTARIZE=0 when
# codesign.conf and notarization.conf are absent, so this needs no secrets.
#
# Delete this file once the question is answered.

name: Spike - macOS appbundle on hosted runners

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image to build on'
        type: choice
        default: 'macos-15'
        options:
          - 'macos-15'
          - 'macos-26'
          - 'macos-15-intel'
          - 'macos-26-intel'
      max_old_space:
        description: 'Override the webpack V8 old-space ceiling, in MB. Leave empty to build exactly as the buildfarm does (4096).'
        type: string
        default: ''
      python_version:
        description: 'Python version to embed. Matches DEFAULT_PYTHON_VERSION on the buildfarm.'
        type: string
        default: '3.13.15'

permissions:
  contents: read

jobs:
  appbundle:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Corepack reads packageManager from the package.json files, matching
      # what run-javascript-tests.yml does.
      - name: Enable Corepack
        run: corepack enable

      - name: Record the runner specification
        run: |
          sw_vers
          echo "Architecture:  $(uname -m)"
          echo "Logical CPUs:  $(sysctl -n hw.logicalcpu)"
          echo "Physical RAM:  $(( $(sysctl -n hw.memsize) / 1024 / 1024 )) MB"
          echo
          sysctl -n vm.swapusage
          echo
          df -h /

      # PostgreSQL supplies pg_dump, pg_dumpall, pg_restore and psql for the
      # bundle, and pg_config for the psycopg[c] build. The buildfarm uses its
      # own PostgreSQL built against its own OpenSSL and Kerberos; Homebrew's
      # is fine here because we are measuring the build, not shipping the
      # result. syft generates the SBOM; wget fetches Electron.
      - name: Install build dependencies
        run: brew install postgresql@18 syft wget

      # The ceiling is hardcoded in build-functions.sh, so overriding it means
      # editing the script. Acceptable in a throwaway spike, and it is what
      # makes bisecting the ceiling possible; the default leaves it untouched.
      - name: Override the webpack memory ceiling
        if: inputs.max_old_space != ''
        env:
          MAX_OLD_SPACE: ${{ inputs.max_old_space }}
        run: |
          sed -i '' \
            -E "s/--max-old-space-size=[0-9]+/--max-old-space-size=${MAX_OLD_SPACE}/" \
            pkg/mac/build-functions.sh
          grep -n 'max-old-space-size' pkg/mac/build-functions.sh

      # Sampled rather than derived from a single rusage figure, because the
      # build is a tree of short-lived processes and what we actually want to
      # know is whether the machine as a whole ran out of headroom. Growing
      # swap is the tell.
      - name: Start the memory sampler
        run: |
          cat > "${RUNNER_TEMP}/sample-memory.sh" <<'EOF'
          #!/bin/bash
          while true; do
              date -u +'--- %H:%M:%S'
              sysctl -n vm.swapusage
              ps -Ao rss=,comm= | sort -rn | head -3 | \
                  awk '{printf "  %7.0f MB  %s\n", $1 / 1024, $2}'
              sleep 10
          done
          EOF
          chmod +x "${RUNNER_TEMP}/sample-memory.sh"
          "${RUNNER_TEMP}/sample-memory.sh" > "${RUNNER_TEMP}/memory.log" 2>&1 &
          echo "SAMPLER_PID=$!" >> "${GITHUB_ENV}"

      - name: Build the appbundle
        env:
          PGADMIN_PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          PGADMIN_POSTGRES_DIR="$(brew --prefix postgresql@18)"
          export PGADMIN_POSTGRES_DIR
          echo "Using PostgreSQL from ${PGADMIN_POSTGRES_DIR}"
          /usr/bin/time -l make appbundle

      - name: Stop the memory sampler
        if: always()
        run: kill "${SAMPLER_PID}" || true

      - name: Report the peak memory and disk usage
        if: always()
        run: |
          echo "=== Largest resident sets seen during the run ==="
          grep ' MB  ' "${RUNNER_TEMP}/memory.log" | sort -rn | head -20 || true
          echo
          echo "=== Swap ==="
          awk '/^total/ {gsub(/M$/, "", $6); if ($6 + 0 > max) max = $6 + 0}
               END {printf "Peak swap used during the run: %.0f MB\n", max}' \
              "${RUNNER_TEMP}/memory.log" || true
          echo -n "Swap now: "
          sysctl -n vm.swapusage
          echo
          echo "=== Final disk ==="
          df -h /

      - name: Archive the memory log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-log-${{ inputs.runner }}
          path: ${{ runner.temp }}/memory.log

      - name: Archive the appbundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-${{ inputs.runner }}
          path: dist/*.dmg
