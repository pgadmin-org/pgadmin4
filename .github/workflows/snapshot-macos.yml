# Signed, notarised macOS snapshot builds, replacing the buildfarm's
# pgadmin4-appbundle-snapshot job.
#
# Unlike check-macos-build.yml this produces something distributable: the
# bundle is signed with the Developer ID, notarised by Apple and stapled, and a
# ZIP is built alongside the DMG because the Electron auto-updater consumes the
# ZIP whilst the DMG is the primary download.
#
# Uploading is deliberately not wired up yet. This proves the signed build
# works; publishing comes after.
#
# Triggered by hand for now rather than nightly, so it cannot start signing
# things before we mean it to.

name: Snapshot - macOS

on:
  workflow_dispatch:

  # workflow_dispatch only offers a "Run workflow" button for workflows that
  # are on the default branch, so whilst this lives on a working branch there
  # is no way to trigger it by hand. The path filter keeps that from meaning
  # "sign and notarise on every commit": it fires only when the thing being
  # tested changes. Remove this trigger when the branch merges.
  push:
    branches: [ "buildfarm-to-actions" ]
    paths:
      - '.github/workflows/snapshot-macos.yml'
      - 'pkg/mac/**'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches DEFAULT_PYTHON_VERSION on the buildfarm.
  PGADMIN_PYTHON_VERSION: '3.13.15'

jobs:
  appbundle:
    runs-on: ${{ matrix.runner }}

    # The signing credentials live on an environment rather than loose on the
    # repository, so only the workflows that should be signing can reach them.
    environment: snapshot

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'arm64', arch: 'arm64',  runner: 'macos-15' }
          - { name: 'x64',   arch: 'x86_64', runner: 'macos-26-intel' }

    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install the build dependencies
        run: brew install syft wget

      # As check-macos-build.yml; see the comment there for why these must
      # land in /opt/pgbuild specifically.
      - name: Install the PostgreSQL build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          PGBUILD_ARCH: ${{ matrix.arch }}
        run: |
          sudo mkdir -p /opt/pgbuild
          sudo chown "$(id -u):$(id -g)" /opt/pgbuild

          for PKG in openssl krb5 zstd lz4 postgresql-18; do
              TAG="${PKG}-macos-${PGBUILD_ARCH}-latest"
              echo "Fetching ${TAG}..."
              gh release download "${TAG}" \
                  --repo pgadmin-org/pgbuild \
                  --dir "${RUNNER_TEMP}" --clobber
              tar -xzf "${RUNNER_TEMP}/${TAG}.tar.gz" -C /opt/pgbuild
          done

      # The buildfarm keeps the Developer ID in the worker's login keychain and
      # unlocks it with devkeys/unlock-csc.sh. A hosted runner has no such
      # keychain, so one is created for this job alone and destroyed after it,
      # which is also why the password is generated rather than configured: it
      # never outlives the job.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=${KEYCHAIN}" >> "${GITHUB_ENV}"

          echo "${MACOS_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${RUNNER_TEMP}/cert.p12" \
              -k "${KEYCHAIN}" \
              -P "${MACOS_CERTIFICATE_PASSWORD}" \
              -T /usr/bin/codesign
          # Without this, codesign prompts for permission to use the key, which
          # on a headless runner means hanging until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychain -d user -s "${KEYCHAIN}" login.keychain

          rm -f "${RUNNER_TEMP}/cert.p12"
          echo "Identities available to codesign:"
          security find-identity -v -p codesigning "${KEYCHAIN}"

      # build.sh decides whether to sign and notarise purely by whether these
      # files exist, which is what keeps the QA build credential-free.
      - name: Write the signing configuration
        env:
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf 'DEVELOPER_ID="%s"\n' "${MACOS_DEVELOPER_ID}" > pkg/mac/codesign.conf
          {
              printf 'DEVELOPER_USER=%s\n' "${APPLE_ID}"
              printf 'DEVELOPER_ASP=%s\n' "${APPLE_APP_SPECIFIC_PASSWORD}"
              printf 'DEVELOPER_TEAM_ID=%s\n' "${APPLE_TEAM_ID}"
          } > pkg/mac/notarization.conf

      # --zip as well as the DMG: the DMG is the download, the ZIP is what the
      # Electron auto-updater fetches. The buildfarm's snapshot job does the
      # same.
      - name: Build the signed appbundle
        run: |
          export PGADMIN_POSTGRES_DIR=/opt/pgbuild/postgresql
          export OPENSSL_DIR=/opt/pgbuild/openssl
          export OPENSSL_STATIC=1

          make appbundle BUILD_OPTS="--zip"

      - name: Verify the signature and notarisation
        run: |
          APP="mac-build/pgAdmin 4.app"
          echo "=== codesign ==="
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign -dvvv "${APP}" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier='
          echo "=== gatekeeper assessment ==="
          spctl --assess --type execute --verbose=4 "${APP}"
          echo "=== stapled notarisation ==="
          xcrun stapler validate "${APP}"
          for F in dist/*.dmg; do
              echo "--- ${F} ---"
              xcrun stapler validate "${F}"
          done

      - name: Archive the disk image and zip
        uses: actions/upload-artifact@v7
        with:
          name: pgadmin4-macos-snapshot-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip

      # Runs even on failure: a keychain holding a Developer ID key must not
      # outlive the job that created it, and the conf files carry the Apple
      # credentials.
      - name: Clean up the credentials
        if: always()
        run: |
          rm -f pkg/mac/codesign.conf pkg/mac/notarization.conf
          if [ -n "${KEYCHAIN:-}" ] && [ -f "${KEYCHAIN}" ]; then
              security delete-keychain "${KEYCHAIN}"
          fi
