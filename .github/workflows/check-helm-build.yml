# Replaces the pgadmin4-helm-buildx-qa Jenkins job, which runs
# `helm package pkg/helm` and nothing else. Helm is installed explicitly rather
# than relied upon from the runner image, since what the images ship changes
# between versions.

name: Check Helm chart build

on:
  # Callable from snapshot.yml, so that what gets published is the
  # same build that runs on every push rather than a second
  # definition of it that can drift.
  workflow_call:

  push:
    branches: [ "master", "buildfarm-to-actions" ]

  workflow_dispatch:

concurrency:
  # The workflow's own name, spelled out rather than taken from
  # github.workflow, because in a reusable workflow that expression is
  # the CALLER's name. Every workflow Snapshot calls would otherwise
  # share one group and, with cancel-in-progress, cancel each other.
  group: 'check-helm-build @ ${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-chart:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o get-helm-3
          chmod 700 get-helm-3
          ./get-helm-3

      - name: Check the chart build
        run: helm package pkg/helm

      - name: Archive the chart
        uses: actions/upload-artifact@v7
        with:
          name: pgadmin4-helm-build-output
          path: pgadmin4-helm-*.tgz
