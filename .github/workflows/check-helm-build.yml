# Replaces the pgadmin4-helm-buildx-qa Jenkins job, which runs
# `helm package pkg/helm` and nothing else. Helm is installed explicitly rather
# than relied upon from the runner image, since what the images ship changes
# between versions.

name: Check Helm chart build

on:
  push:
    branches: [ "master" ]

  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-chart:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o get-helm-3
          chmod 700 get-helm-3
          ./get-helm-3

      - name: Check the chart build
        run: helm package pkg/helm

      - name: Archive the chart
        uses: actions/upload-artifact@v7
        with:
          name: pgadmin4-helm-build-output
          path: pgadmin4-helm-*.tgz
