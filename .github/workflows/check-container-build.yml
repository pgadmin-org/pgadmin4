name: Check container build

on:
  # Callable, so that a workflow which needs a container build gets this one
  # rather than a second definition of it that can drift. Snapshot does not
  # call it today, the image not being part of the download tree.
  workflow_call:
    inputs:
      publish:
        description: >-
          Build for both architectures and push to the registry, tagged
          with the location below. A build check does neither: it proves
          the Dockerfile still works and throws the image away.
        type: boolean
        required: false
        default: false
      location:
        description: The tag to push, normally the build's date
        type: string
        required: false
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

  push:
    branches: [ "master" ]
    paths:
      - 'Dockerfile'
      - 'pkg/docker/**'
      - 'web/**'
      # Not the message catalogues: a .po change cannot break a build or a
      # test, and check-translations already compiles them, which is the
      # check that would catch a malformed one.
      - '!web/pgadmin/translations/**'
      - 'requirements.txt'
      - 'docs/**'
      - '.dockerignore'
      - 'LICENSE'
      - '.github/workflows/check-container-build.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'Dockerfile'
      - 'pkg/docker/**'
      - 'web/**'
      # Not the message catalogues: a .po change cannot break a build or a
      # test, and check-translations already compiles them, which is the
      # check that would catch a malformed one.
      - '!web/pgadmin/translations/**'
      - 'requirements.txt'
      - 'docs/**'
      - '.dockerignore'
      - 'LICENSE'
      - '.github/workflows/check-container-build.yml'

  workflow_dispatch:
    inputs:
      publish:
        description: Build for both architectures and push to the registries
        type: boolean
        required: false
        default: false
      location:
        description: The tag to push, normally the build's date
        type: string
        required: false
        default: ''

concurrency:
  # The workflow's own name, spelled out rather than taken from
  # github.workflow, because in a reusable workflow that expression is
  # the CALLER's name. Every workflow Snapshot calls would otherwise
  # share one group and, with cancel-in-progress, cancel each other.
  # github.event_name is in the key because a called workflow inherits the
  # caller's ref: once this is on master, the nightly Snapshot's deb build
  # and an ordinary push's deb build would otherwise share a group and,
  # with cancel-in-progress, kill each other. A push landing mid-nightly
  # would cancel the snapshot's build and skip the publish entirely.
  group: 'check-container-build @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }} @ ${{ github.event_name }}'
  cancel-in-progress: true

jobs:
  build-container:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      # For GHCR, which takes the workflow's own token rather than a stored
      # registry credential.
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Only for a publishing build. Emulation is slow, so a plain check
      # builds for the runner's own architecture and nothing else.
      - name: Set up QEMU
        if: inputs.publish
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: inputs.publish
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No stored credential: the workflow's own token, scoped by the
      # packages: write permission below.
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the container builds
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .

      # Tagged with the build's location rather than a version. Promotion
      # re-tags this exact image, so what ships is the manifest that was
      # tested rather than a rebuild of the same source.
      - name: Build and push the container
        if: inputs.publish
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            dpage/pgadmin4:${{ inputs.location }}
            ghcr.io/pgadmin-org/pgadmin4:${{ inputs.location }}
