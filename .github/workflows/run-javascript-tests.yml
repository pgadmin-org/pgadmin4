name: Run Javascript tests

on:
  push:
    branches: [ "master" ]
    paths:
      - 'web/**/*.js'
      - 'web/**/*.jsx'
      - 'web/package.json'
      - 'web/yarn.lock'
      - 'web/jest.config.js'
      - 'web/webpack.shim.js'
      - 'web/regression/javascript/**'
      - 'web/.yarnrc.yml'
      - 'web/babel.config.json'
      - '.github/workflows/run-javascript-tests.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'web/**/*.js'
      - 'web/**/*.jsx'
      - 'web/package.json'
      - 'web/yarn.lock'
      - 'web/jest.config.js'
      - 'web/webpack.shim.js'
      - 'web/regression/javascript/**'
      - 'web/.yarnrc.yml'
      - 'web/babel.config.json'
      - '.github/workflows/run-javascript-tests.yml'

  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  run-javascript-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - uses: actions/checkout@v7

      # Corepack reads packageManager from web/package.json and provisions
      # exactly that Yarn: a single pinned download, with nothing written
      # into the checkout.
      - name: Enable Corepack
        run: corepack enable

      - name: Install Node modules
        run: |
          cd web
          yarn install

      - name: Run the tests
        run: |
          cd web
          yarn run test:js-once
