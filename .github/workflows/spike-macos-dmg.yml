# Throwaway diagnostic spike. NOT part of CI.
#
# `hdiutil detach` fails deterministically on macos-15-intel at the end of
# create-dmg, always exactly 120 seconds after the unmount starts:
#
#     Unmounting disk image...
#     hdiutil: detach: timeout for DiskArbitration expired
#     hdiutil: detach: drive not detached
#
# Three appbundle runs, three identical failures, while arm64 passed four times
# through the same code. Disabling Spotlight made no difference.
#
# Reproducing that through `make appbundle` costs 40 minutes a go, most of it
# compiling cryptography, so this reproduces it directly instead and takes a
# couple of minutes. It answers three questions at once:
#
#   1. Is it create-dmg at all, or plain hdiutil? (test A vs test B)
#   2. Does it depend on image size? (test A runs small and large)
#   3. Is it the runner image? (the matrix includes macos-26-intel, with
#      arm64 as the control that is known to work)
#
# and when something does fail, it captures who is holding the volume rather
# than leaving us to guess: hdiutil's own view, lsof, the diskarbitrationd
# log, and whether a forced detach succeeds where the polite one did not.
#
# Delete once the cause is understood.

name: Spike - macOS DMG detach diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        runner:
          - 'macos-15-intel'
          - 'macos-26-intel'
          - 'macos-15'

    steps:
      - uses: actions/checkout@v7

      - name: Record the runner specification
        run: |
          sw_vers
          echo "Architecture: $(uname -m)"
          echo "CPUs:         $(sysctl -n hw.logicalcpu)"
          echo "RAM:          $(( $(sysctl -n hw.memsize) / 1024 / 1024 )) MB"
          df -h /

      # Written once and reused by every test below, so a failure anywhere
      # produces the same evidence.
      - name: Install the diagnostic helper
        run: |
          cat > "${RUNNER_TEMP}/diagnose.sh" <<'EOF'
          #!/bin/bash
          # $1 = mount point (may be empty), $2 = device node (may be empty)
          MOUNT="$1"
          DEV="$2"
          echo "======== DIAGNOSTICS ========"

          echo "---- hdiutil info ----"
          hdiutil info || true

          echo "---- mounted volumes ----"
          ls -l /Volumes/ || true
          mount || true

          echo "---- lsof against the volume ----"
          if [ -n "${MOUNT}" ]; then
              lsof "${MOUNT}" 2>/dev/null || true
              lsof +D "${MOUNT}" 2>/dev/null || true
          fi
          lsof 2>/dev/null | grep -F '/Volumes/' || echo "(no lsof rows mentioning /Volumes/)"

          echo "---- processes that tend to hold volumes ----"
          ps aux | grep -E 'mds|mds_stores|fseventsd|diskarbitrationd|Spotlight|antivirus' \
              | grep -v grep || echo "(none)"

          echo "---- diskarbitrationd log, last 3 minutes ----"
          sudo log show --last 3m --predicate \
              'process == "diskarbitrationd" OR process == "hdiutil" OR process == "diskimages-helper"' \
              --style compact 2>/dev/null | tail -60 || echo "(log show unavailable)"

          echo "---- does a forced detach work where the polite one did not? ----"
          if [ -n "${DEV}" ]; then
              time hdiutil detach "${DEV}" -force && echo "FORCED DETACH: SUCCEEDED" \
                  || echo "FORCED DETACH: ALSO FAILED"
          fi
          echo "======== END DIAGNOSTICS ========"
          EOF
          chmod +x "${RUNNER_TEMP}/diagnose.sh"

      # Test A: no create-dmg, no pgAdmin, just hdiutil. If this fails, the
      # problem is the runner's disk image handling and create-dmg is a
      # bystander. Two sizes, because a 120-second timeout smells like it
      # could scale with how much there is to flush.
      - name: 'Test A: bare hdiutil attach/detach'
        id: test_a
        continue-on-error: true
        run: |
          set -o pipefail
          for SIZE in 100m 1500m; do
              echo "############ bare hdiutil, ${SIZE} ############"
              IMG="${RUNNER_TEMP}/bare-${SIZE}.dmg"
              rm -f "${IMG}"
              hdiutil create -size "${SIZE}" -fs HFS+ -volname "BareTest" "${IMG}"

              DEV=$(hdiutil attach "${IMG}" -nobrowse -noverify -noautoopen \
                  | grep -E '^/dev/' | head -1 | awk '{print $1}')
              MOUNT=$(mount | grep -F "${DEV}" | sed -E 's/.* on (.*) \(.*/\1/')
              echo "device=${DEV} mount=${MOUNT}"

              # Put something in it, so the detach has buffers to flush.
              dd if=/dev/urandom of="${MOUNT}/payload" bs=1m count=50 2>/dev/null
              sync

              echo "---- detaching ----"
              START=$(date +%s)
              if hdiutil detach "${DEV}"; then
                  echo "DETACH OK after $(( $(date +%s) - START ))s (${SIZE})"
              else
                  echo "DETACH FAILED after $(( $(date +%s) - START ))s (${SIZE})"
                  "${RUNNER_TEMP}/diagnose.sh" "${MOUNT}" "${DEV}"
                  exit 1
              fi
          done

      # Test B: create-dmg with pgAdmin's real flags and real assets, over a
      # payload of roughly the size of the actual bundle. This is the failing
      # path, minus the 40 minutes of build in front of it.
      - name: 'Test B: create-dmg with pgAdmin flags'
        id: test_b
        continue-on-error: true
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/create-dmg/create-dmg.git "${RUNNER_TEMP}/create-dmg"
          echo "create-dmg at $(git -C "${RUNNER_TEMP}/create-dmg" rev-parse --short HEAD)"

          # A stand-in for the .app: a few hundred MB of mixed compressible and
          # incompressible data, since the real DMG is UDBZ and the bundle is
          # mostly a Python framework plus Electron.
          APP="${RUNNER_TEMP}/pgAdmin 4.app"
          mkdir -p "${APP}/Contents/MacOS"
          dd if=/dev/urandom of="${APP}/Contents/MacOS/blob" bs=1m count=400 2>/dev/null
          for i in $(seq 1 200); do
              cp "${GITHUB_WORKSPACE}/README.md" "${APP}/Contents/text-${i}.md"
          done
          du -sh "${APP}"

          mkdir -p "${RUNNER_TEMP}/out"
          START=$(date +%s)
          set +e
          "${RUNNER_TEMP}/create-dmg/create-dmg" \
              --volname "pgAdmin 4" \
              --volicon "${GITHUB_WORKSPACE}/pkg/mac/dmg-icon.icns" \
              --eula "${GITHUB_WORKSPACE}/pkg/mac/licence.rtf" \
              --background "${GITHUB_WORKSPACE}/pkg/mac/dmg-background.png" \
              --app-drop-link 600 220 \
              --icon "pgAdmin 4.app" 200 220 \
              --window-pos 200 120 \
              --window-size 800 400 \
              --hide-extension "pgAdmin 4.app" \
              --add-file .DS_Store "${GITHUB_WORKSPACE}/pkg/mac/dmg.DS_Store" 5 5 \
              --format UDBZ \
              --skip-jenkins \
              --no-internet-enable \
              "${RUNNER_TEMP}/out/test.dmg" \
              "${APP}"
          RC=$?
          set -e
          echo "create-dmg exited ${RC} after $(( $(date +%s) - START ))s"

          if [ ${RC} -ne 0 ]; then
              # create-dmg leaves the volume mounted when the detach fails, so
              # find it rather than assuming a name.
              MOUNT=$(ls -d /Volumes/dmg.* 2>/dev/null | head -1)
              DEV=$(mount | grep -F "${MOUNT}" | awk '{print $1}')
              echo "leftover mount=${MOUNT} device=${DEV}"
              "${RUNNER_TEMP}/diagnose.sh" "${MOUNT}" "${DEV}"
              exit 1
          fi

          ls -lh "${RUNNER_TEMP}/out/"

      # Tests A and B both passed on every runner, which rules out the runner
      # image, hdiutil generally, create-dmg's invocation and volume size. So
      # the variable is the bundle itself: test B's stand-in was a random blob
      # in Contents/MacOS with no Info.plist and no Mach-O, which is not an app
      # as far as the system is concerned. A genuine bundle arriving on a fresh
      # volume gets noticed by LaunchServices and Gatekeeper in a way a folder
      # of noise does not.
      #
      # Test C is a real, signed, framework-bearing bundle with helper apps:
      # Electron, which is literally what the real build starts from.
      - name: 'Test C: create-dmg over a real Electron.app'
        id: test_c
        continue-on-error: true
        run: |
          set -o pipefail
          ARCH="x64"
          [ "$(uname -m)" = "arm64" ] && ARCH="arm64"
          VER=$(sed -nE 's/.*"electron":[[:space:]]*"\^?([0-9.]+)".*/\1/p' runtime/package.json | head -1)
          echo "electron ${VER} ${ARCH}"

          cd "${RUNNER_TEMP}"
          rm -rf electron-app && mkdir electron-app && cd electron-app
          curl -fsSL -o electron.zip \
              "https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-darwin-${ARCH}.zip"
          unzip -q electron.zip
          mv Electron.app "pgAdmin 4.app"
          du -sh "pgAdmin 4.app"

          "${RUNNER_TEMP}/create-dmg/create-dmg" \
              --volname "pgAdmin 4" --format UDBZ --skip-jenkins --no-internet-enable \
              "${RUNNER_TEMP}/out-c.dmg" "${RUNNER_TEMP}/electron-app/pgAdmin 4.app" \
              && echo "TEST C: create-dmg OK" && exit 0

          echo "TEST C: create-dmg FAILED"
          MOUNT=$(ls -d /Volumes/dmg.* 2>/dev/null | head -1)
          DEV=$(mount | grep -F "${MOUNT}" | awk '{print $1}')
          "${RUNNER_TEMP}/diagnose.sh" "${MOUNT}" "${DEV}"
          exit 1

      # Test D adds the other symlink-heavy component the real build layers on
      # top: a relocatable Python framework, with its Versions/Current links.
      # Built without pip installing anything, so this stays minutes rather
      # than the half hour the real build spends compiling cryptography.
      - name: 'Test D: Electron.app plus a Python framework'
        id: test_d
        continue-on-error: true
        run: |
          set -o pipefail
          APP="${RUNNER_TEMP}/electron-app/pgAdmin 4.app"
          [ -d "${APP}" ] || { echo "test C did not leave a bundle; skipping"; exit 1; }

          git clone --depth 1 https://github.com/gregneagle/relocatable-python.git \
              "${RUNNER_TEMP}/relocatable_python"
          python3 "${RUNNER_TEMP}/relocatable_python/make_relocatable_python_framework.py" \
              --python-version 3.13.15 --os-version 11 \
              --destination "${APP}/Contents/Frameworks/"
          du -sh "${APP}"
          find "${APP}/Contents/Frameworks" -type l | head -20

          "${RUNNER_TEMP}/create-dmg/create-dmg" \
              --volname "pgAdmin 4" --format UDBZ --skip-jenkins --no-internet-enable \
              "${RUNNER_TEMP}/out-d.dmg" "${APP}" \
              && echo "TEST D: create-dmg OK" && exit 0

          echo "TEST D: create-dmg FAILED"
          MOUNT=$(ls -d /Volumes/dmg.* 2>/dev/null | head -1)
          DEV=$(mount | grep -F "${MOUNT}" | awk '{print $1}')
          "${RUNNER_TEMP}/diagnose.sh" "${MOUNT}" "${DEV}"
          exit 1

      # Test E separates file count from content type, which tests B to D
      # cannot: B was ~409 MB in 201 files, D was ~415 MB in a few thousand,
      # and both passed. The real bundle holds roughly the same order of data
      # but across far more files: web/ alone is 4,626 (2,043 of them .sql
      # templates), docs/ another 773, and then site-packages and the Python
      # stdlib on top, so 30,000+ is a fair estimate.
      #
      # So this puts the same ~400 MB into 30,000 small text files with no
      # Mach-O content whatsoever. If the unmount time climbs, the driver is
      # the number of files rather than Gatekeeper or LaunchServices examining
      # binaries, and no amount of signing or scanning policy will help.
      - name: 'Test E: create-dmg over 30,000 small files'
        id: test_e
        continue-on-error: true
        run: |
          set -o pipefail
          APP="${RUNNER_TEMP}/many-files/pgAdmin 4.app"
          rm -rf "${RUNNER_TEMP}/many-files"
          mkdir -p "${APP}/Contents/Resources"

          python3 - "${APP}/Contents/Resources" <<'PY'
          import os, sys, random
          root = sys.argv[1]
          random.seed(1)
          # 30,000 files of ~13 KB, spread over a tree rather than one flat
          # directory, which is closer to how the bundle is actually shaped.
          for i in range(30000):
              d = os.path.join(root, f"d{i // 200:03d}")
              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, f"f{i:05d}.sql"), "w") as fh:
                  fh.write("-- generated\n" + ("SELECT 1;\n" * 1200))
          PY
          echo "files: $(find "${APP}" -type f | wc -l)"
          du -sh "${APP}"

          START=$(date +%s)
          "${RUNNER_TEMP}/create-dmg/create-dmg" \
              --volname "pgAdmin 4" --format UDBZ --skip-jenkins --no-internet-enable \
              "${RUNNER_TEMP}/out-e.dmg" "${APP}" \
              && echo "TEST E: create-dmg OK after $(( $(date +%s) - START ))s" && exit 0

          echo "TEST E: create-dmg FAILED after $(( $(date +%s) - START ))s"
          MOUNT=$(ls -d /Volumes/dmg.* 2>/dev/null | head -1)
          DEV=$(mount | grep -F "${MOUNT}" | awk '{print $1}')
          "${RUNNER_TEMP}/diagnose.sh" "${MOUNT}" "${DEV}"
          exit 1

      # Test F prototypes the replacement for create-dmg. `hdiutil create
      # -srcfolder` builds the image straight from a directory and never mounts
      # a volume, so DiskArbitration is never involved and there is nothing to
      # detach. That matters because the recovery we tried first does not work:
      # `hdiutil detach -force` waits on DiskArbitration exactly as the polite
      # detach does, timing out after the same 120 seconds with the same
      # message, and the subsequent convert then fails with "Resource
      # temporarily unavailable" because the image is still attached.
      #
      # Everything create-dmg does for us with --skip-jenkins is staging: the
      # volume name, the Applications symlink, the background directory, the
      # pre-built .DS_Store and hiding the .app extension. The two that are not
      # merely staging are the volume icon, which needs the custom-icon flag on
      # the volume root, and the EULA, which is a resource attached to the
      # finished image rather than a file inside it. This checks what survives.
      - name: 'Test F: hdiutil create -srcfolder, no mount at all'
        id: test_f
        continue-on-error: true
        run: |
          set -o pipefail
          APP="${RUNNER_TEMP}/electron-app/pgAdmin 4.app"
          [ -d "${APP}" ] || { echo "test C did not leave a bundle; skipping"; exit 1; }

          STAGE="${RUNNER_TEMP}/stage"
          rm -rf "${STAGE}" && mkdir -p "${STAGE}/.background"
          cp -R "${APP}" "${STAGE}/"
          cp "${GITHUB_WORKSPACE}/pkg/mac/dmg-background.png" "${STAGE}/.background/"
          cp "${GITHUB_WORKSPACE}/pkg/mac/dmg.DS_Store" "${STAGE}/.DS_Store"
          cp "${GITHUB_WORKSPACE}/pkg/mac/dmg-icon.icns" "${STAGE}/.VolumeIcon.icns"
          ln -s /Applications "${STAGE}/Applications"

          # Finder attributes: C marks the volume as having a custom icon, E
          # hides the .app's extension. Both are what create-dmg's --volicon
          # and --hide-extension ultimately set.
          SetFile -a C "${STAGE}" || echo "WARNING: SetFile -a C failed"
          SetFile -a E "${STAGE}/pgAdmin 4.app" || echo "WARNING: SetFile -a E failed"

          OUT="${RUNNER_TEMP}/out-f.dmg"
          rm -f "${OUT}"
          START=$(date +%s)
          hdiutil create \
              -srcfolder "${STAGE}" \
              -volname "pgAdmin 4" \
              -fs HFS+ \
              -format UDBZ \
              -ov \
              "${OUT}"
          echo "TEST F: created in $(( $(date +%s) - START ))s"

          ls -lh "${OUT}"
          hdiutil verify "${OUT}"
          hdiutil imageinfo "${OUT}" | grep -iE 'Format:|Checksum Type:|partition-scheme' || true

          # Attach the EULA the way create-dmg does, so we learn now whether it
          # is workable rather than after rewriting _create_dmg.
          if [ -f "${RUNNER_TEMP}/create-dmg/support/eula-resources-template.xml" ]; then
              echo "eula template present; udifrez would run here"
          else
              echo "NOTE: create-dmg's eula template not found at the expected path"
              find "${RUNNER_TEMP}/create-dmg" -iname '*eula*' | head -5
          fi

      # Read-only mount of the finished image to confirm the styling actually
      # made it in. Mounting a compressed image briefly is not the expensive
      # operation; unmounting a large populated read/write volume is.
      - name: 'Test F: verify the image contents'
        if: always()
        continue-on-error: true
        run: |
          OUT="${RUNNER_TEMP}/out-f.dmg"
          [ -f "${OUT}" ] || { echo "no image to inspect"; exit 1; }
          DEV=$(hdiutil attach "${OUT}" -readonly -nobrowse -noverify -noautoopen \
              | grep -E '^/dev/' | head -1 | awk '{print $1}')
          MOUNT=$(mount | grep -F "${DEV}" | sed -E 's/.* on (.*) \(.*/\1/')
          echo "mounted ${DEV} at ${MOUNT}"
          ls -la "${MOUNT}/"
          echo "--- volume name ---"
          basename "${MOUNT}"
          echo "--- detaching (read-only, should be quick) ---"
          time hdiutil detach "${DEV}" || hdiutil detach "${DEV}" -force || true

      - name: Summarise
        if: always()
        run: |
          echo "runner:  ${{ matrix.runner }}"
          echo "test A (bare hdiutil):            ${{ steps.test_a.outcome }}"
          echo "test B (create-dmg, synthetic):   ${{ steps.test_b.outcome }}"
          echo "test C (create-dmg, Electron):    ${{ steps.test_c.outcome }}"
          echo "test D (Electron + Python fwk):   ${{ steps.test_d.outcome }}"
          echo "test E (30,000 small files):      ${{ steps.test_e.outcome }}"
          echo "test F (hdiutil -srcfolder):      ${{ steps.test_f.outcome }}"
