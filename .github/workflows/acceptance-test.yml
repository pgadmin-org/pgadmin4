# Install pgAdmin from a published tree, exactly as the README tells a user to.
#
# Everything else in this pipeline checks that files exist, that indexes parse
# and that signatures validate. All three can be true of a repository apt still
# refuses, and two bugs found during the migration were of precisely that
# shape: packages one directory too deep, and noarch RPMs filed where no dnf
# client looks. Neither failed a build.
#
# So this does not inspect anything. It follows the instructions in the
# repository README, in a clean container, and installs the package. No
# --allow-unauthenticated, no --nogpgcheck, no pinning: if the signature is
# wrong or the architecture is missing from Release, the install fails, which
# is the point.
#
# It runs against a release candidate on the development server, which serves
# its tree the moment it is written. The download server sits behind an hourly
# sync to the mirrors, so testing there would mostly measure the sync.

name: Acceptance test

on:
  workflow_call:
    inputs:
      base-url:
        description: The tree to install from, without a trailing slash
        required: true
        type: string

  workflow_dispatch:
    inputs:
      base-url:
        description: >-
          The tree to install from, for example
          https://developer.pgadmin.org/builds/2026-09-21-1
        required: true
        type: string

concurrency:
  group: 'acceptance-test @ ${{ inputs.base-url }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apt:
    runs-on: ubuntu-24.04

    # The images default to sh, which has no pipefail, so every step that set
    # it died on the first line. All of these carry bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'bookworm', image: 'debian:12' }
          - { name: 'trixie',   image: 'debian:13' }
          - { name: 'jammy',    image: 'ubuntu:22.04' }
          - { name: 'noble',    image: 'ubuntu:24.04' }
          - { name: 'resolute', image: 'ubuntu:26.04' }
    container: ${{ matrix.image }}

    steps:
      # Only what a user would already have or would obviously need. lsb-release
      # is here because the README's own sources.list line calls lsb_release,
      # and following the instruction is the test.
      - name: Install the prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release

      - name: Follow the README
        env:
          BASE_URL: ${{ inputs.base-url }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          curl -fsS https://www.pgadmin.org/static/packages_pgadmin_org.pub \
              | gpg --dearmor -o /usr/share/keyrings/packages-pgadmin-org.gpg

          sh -c "echo \"deb [signed-by=/usr/share/keyrings/packages-pgadmin-org.gpg] ${BASE_URL}/apt/\$(lsb_release -cs) pgadmin4 main\" \
              > /etc/apt/sources.list.d/pgadmin4.list"
          cat /etc/apt/sources.list.d/pgadmin4.list

          # A repository apt will not verify makes this fail here, before any
          # package is considered.
          apt-get update

      - name: Install pgAdmin
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get install -y pgadmin4-server

          # The version proves what installed is this build rather than
          # something the distribution happened to carry, and the file list
          # proves the package actually delivered its payload.
          dpkg-query -W -f '${Package} ${Version}\n' pgadmin4-server
          # grep without -q, deliberately: -q exits on the first match, the
          # command feeding it then dies of SIGPIPE, and pipefail turns that
          # into a failed pipeline even though the match succeeded.
          dpkg -L pgadmin4-server | grep '^/usr/pgadmin4/' >/dev/null || {
              echo "pgadmin4-server installed no files under /usr/pgadmin4" >&2
              exit 1; }

  yum:
    runs-on: ubuntu-24.04

    # The images default to sh, which has no pipefail, so every step that set
    # it died on the first line. All of these carry bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'rhel-9',    image: 'almalinux:9',  family: 'redhat' }
          - { name: 'rhel-10',   image: 'almalinux:10', family: 'redhat' }
          - { name: 'fedora-43', image: 'fedora:43',    family: 'fedora' }
          - { name: 'fedora-44', image: 'fedora:44',    family: 'fedora' }
    container: ${{ matrix.image }}

    steps:
      - name: Follow the README
        env:
          BASE_URL: ${{ inputs.base-url }}
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail

          # The repository RPM carries the .repo file and the packaging key, and
          # points at the tree it shipped in, so nothing here names a URL twice.
          # It sets gpgcheck=1 and repo_gpgcheck=1, which is why no --nogpgcheck
          # appears below: a wrongly signed repository fails at this step.
          RPM=$(curl -fsS "${BASE_URL}/yum/" \
              | grep -oE "pgadmin4-${FAMILY}-repo-[0-9.-]+\.noarch\.rpm" \
              | sort -u | tail -1)
          echo "Repository package: ${RPM}"
          rpm -i "${BASE_URL}/yum/${RPM}"
          cat /etc/yum.repos.d/pgadmin4.repo

      - name: Install pgAdmin
        run: |
          set -euo pipefail
          dnf install -y pgadmin4-server
          rpm -q pgadmin4-server
          # grep without -q, deliberately: -q exits on the first match, the
          # command feeding it then dies of SIGPIPE, and pipefail turns that
          # into a failed pipeline even though the match succeeded.
          rpm -ql pgadmin4-server | grep '^/usr/pgadmin4/' >/dev/null || {
              echo "pgadmin4-server installed no files under /usr/pgadmin4" >&2
              exit 1; }

  # The Windows installer, actually installed. Nothing else in the pipeline
  # runs it, and until now nothing verified the signature on the executable
  # inside it either: Make.bat's own check tested a stale %ERRORLEVEL%, and the
  # workflow step that claimed to cover the gap only re-verified the installer.
  windows:
    runs-on: windows-2025
    steps:
      - name: Download and install
        shell: pwsh
        env:
          BASE_URL: ${{ inputs.base-url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $listing = Invoke-WebRequest -Uri "$env:BASE_URL/" -UseBasicParsing
          $name = ([regex]'pgadmin4-[0-9.]+-x64\.exe').Matches($listing.Content) |
                    ForEach-Object { $_.Value } | Sort-Object -Unique | Select-Object -Last 1
          if (-not $name) { throw "No installer found at $env:BASE_URL" }
          Write-Output "Installer: $name"

          Invoke-WebRequest -Uri "$env:BASE_URL/$name" -OutFile installer.exe -UseBasicParsing

          # The installer's own signature, before running anything from it.
          $sig = Get-AuthenticodeSignature installer.exe
          Write-Output "Installer signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature is $($sig.Status)" }

          # Inno Setup's silent switches. /DIR is given so the check below does
          # not depend on the default install location.
          $p = Start-Process -FilePath .\installer.exe -Wait -PassThru `
              -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\pgadmin4-test'
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }

      - name: Check what was installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\pgadmin4-test'

          foreach ($f in @(
              "$root\runtime\pgAdmin4.exe",
              "$root\runtime\libpq.dll",
              "$root\runtime\pg_dump.exe",
              "$root\runtime\gssapi64.dll",
              "$root\python\python.exe",
              "$root\web\pgAdmin4.py")) {
              if (-not (Test-Path $f)) { throw "Missing from the installation: $f" }
              Write-Output "present: $f"
          }

          # The executable users actually run. Verified here because it is the
          # only place it can be: it does not exist outside the installer until
          # the installer has run.
          $sig = Get-AuthenticodeSignature "$root\runtime\pgAdmin4.exe"
          Write-Output "pgAdmin4.exe signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "pgAdmin4.exe signature is $($sig.Status)" }

  # The macOS disk image as published, rather than the bundle as built. The
  # snapshot workflow checks the bundle it has just made; this checks what a
  # user downloads, which has been through a DMG, a web server and a browser's
  # quarantine attribute.
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'arm64', runner: 'macos-15' }
          - { name: 'x64',   runner: 'macos-26-intel' }
    steps:
      - name: Download, mount and check
        env:
          BASE_URL: ${{ inputs.base-url }}
          ARCH: ${{ matrix.name }}
        run: |
          set -euo pipefail
          name=$(curl -fsS "${BASE_URL}/" \
              | grep -oE "pgadmin4-[0-9.]+-${ARCH}\.dmg" | sort -u | tail -1)
          [ -n "${name}" ] || { echo "No ${ARCH} disk image found" >&2; exit 1; }
          echo "Disk image: ${name}"
          curl -fsS -o image.dmg "${BASE_URL}/${name}"

          # Quarantine it as a browser would, so Gatekeeper is actually
          # consulted rather than bypassed because the file arrived by curl.
          xattr -w com.apple.quarantine \
              "0081;$(printf '%x' "$(date +%s)");Safari;" image.dmg

          hdiutil attach image.dmg -nobrowse -readonly -mountpoint /tmp/pga
          app="/tmp/pga/pgAdmin 4.app"

          test -d "${app}"
          test -x "${app}/Contents/MacOS/pgAdmin 4"
          test -x "${app}/Contents/SharedSupport/pg_dump"
          test -f "${app}/Contents/Resources/web/pgAdmin4.py"

          # Gatekeeper first, because that is what decides whether a user can
          # open this. codesign --strict comes after and is allowed to have its
          # own opinion: the disk image deliberately carries a FinderInfo xattr
          # on the bundle, set by SetFile -a E in _create_dmg to hide the .app
          # extension in the window, and --strict rejects any xattr at all.
          echo "=== notarisation and Gatekeeper ==="
          xcrun stapler validate "${app}"
          spctl --assess --type execute --verbose=4 "${app}"

          echo "=== signature ==="
          codesign -dvvv "${app}" 2>&1 | grep -E 'Authority|TeamIdentifier'
          codesign --verify --deep --verbose=2 "${app}"

          # Reported rather than enforced. If this ever starts failing whilst
          # spctl still passes, it is the extension-hiding attribute and not a
          # broken signature; if spctl fails too, the build is broken.
          if ! codesign --verify --deep --strict --verbose=2 "${app}" 2>/tmp/strict.log; then
              echo "note: --strict verification failed, Gatekeeper having passed:"
              tail -2 /tmp/strict.log
          fi

          # Nothing in the bundle may reference a build machine. This is what
          # catches a dependency that was linked but not relocated, which is
          # how an ICU or OpenSSL path would escape.
          echo "=== linkage of the bundled client binaries ==="
          for b in pg_dump pg_dumpall pg_restore psql; do
              echo "--- ${b} ---"
              otool -L "${app}/Contents/SharedSupport/${b}" | tail -n +2
          done
          if otool -L "${app}/Contents/SharedSupport/"* \
                  | grep -E '/opt/pgbuild|/opt/homebrew|/usr/local/(lib|opt)'; then
              echo "A bundled binary still points outside the bundle" >&2
              exit 1
          fi

          hdiutil detach /tmp/pga

  # The downloads nobody installs: the wheel, the tarballs and the documents.
  # Shallow by design, but it does verify every detached signature from the
  # published URL rather than on the server, which is what a user would get.
  artefacts:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch and check
        env:
          BASE_URL: ${{ inputs.base-url }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl

          listing=$(curl -fsS "${BASE_URL}/")
          fetch() {
              local pattern=$1 name
              name=$(printf '%s' "${listing}" | grep -oE "${pattern}" | sort -u | tail -1)
              [ -n "${name}" ] || { echo "Nothing matching ${pattern}" >&2; exit 1; }
              curl -fsS -O "${BASE_URL}/${name}"
              echo "${name}"
          }

          tarball=$(fetch 'pgadmin4-[0-9.]+\.tar\.gz')
          wheel=$(fetch 'pgadmin4-[0-9.]+-py3-none-any\.whl')
          docs=$(fetch 'pgadmin4-[0-9.]+-docs\.tar\.gz')
          pdf=$(fetch 'pgadmin4-[0-9.]+\.pdf')
          epub=$(fetch 'pgadmin4-[0-9.]+\.epub')

          echo "=== signatures, as a user would verify them ==="
          export GNUPGHOME=$(mktemp -d); chmod 700 "${GNUPGHOME}"
          curl -fsS https://www.pgadmin.org/static/packages_pgadmin_org.pub | gpg --import
          for f in "${tarball}" "${wheel}" "${docs}" "${pdf}" "${epub}"; do
              curl -fsS -O "${BASE_URL}/${f}.asc"
              gpg --verify "${f}.asc" "${f}"
          done

          echo "=== the documents are what they claim to be ==="
          file "${pdf}" | grep -q 'PDF document'
          file "${epub}" | grep -q 'EPUB'
          # A truncated PDF still says PDF, so size is checked too.
          [ "$(stat -c%s "${pdf}")" -gt 1000000 ] || { echo "PDF is implausibly small" >&2; exit 1; }

          echo "=== the tarballs contain what they should ==="
          tar tzf "${tarball}" | grep -E '/web/pgAdmin4\.py$' >/dev/null
          tar tzf "${tarball}" | grep -E '/requirements\.txt$' >/dev/null
          tar tzf "${docs}" | grep -E 'index\.html$' >/dev/null

      - name: Install the wheel
        run: |
          set -euo pipefail
          cd dl
          python3 -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet pgadmin4-*-py3-none-any.whl
          /tmp/wheeltest/bin/python -c 'import pgadmin4; print("imported", pgadmin4.__file__)'
