version: 2

# A note on the "groups" blocks below: minor and patch updates are batched into
# a single PR per manifest per week, whilst major updates continue to arrive
# individually. Majors are where the breakage lives and each one wants its own
# review, whereas a dozen separate PRs for patch bumps is pure overhead.
# Grouping applies to version updates only, so Dependabot security updates are
# unaffected and still arrive as their own PRs.
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "Dependencies"
    commit-message:
      prefix: "Docker dependency"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "Dependencies"
    commit-message:
      prefix: "Python dependency"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # paramiko 5.0 removed DSSKey, which sshtunnel 0.4.0 still references in
    # SSHTunnelForwarder.get_keys(); a major bump therefore breaks every SSH
    # tunnelled connection at construction time. sshtunnel has had no release
    # since 2019, so this stays put until it is fixed or replaced. See #9927.
    ignore:
      - dependency-name: "paramiko"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
    labels:
      - "Dependencies"
    commit-message:
      prefix: "Python dependency"
    groups:
      tools-python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Note that web/regression/requirements.txt begins with
  # "-r ../../requirements.txt", so this entry also sees everything pinned in
  # the root file and the paramiko exclusion has to be repeated here.
  - package-ecosystem: "pip"
    directory: "/web/regression"
    schedule:
      interval: "weekly"
    labels:
      - "Dependencies"
    commit-message:
      prefix: "Python dependency"
    groups:
      regression-python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "paramiko"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/runtime"
    schedule:
      interval: "weekly"
    labels:
      - "Dependencies"
    commit-message:
      prefix: "Javascript dependency"
    groups:
      runtime-javascript-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels:
      - "Dependencies"
    commit-message:
      prefix: "Javascript dependency"
    groups:
      web-javascript-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @testing-library/jest-dom 7 requires Node >= 22, whilst Node 20 is the
      # minimum we support and what most of the buildfarm runs. Revisit once
      # the buildfarm moves to Node 22. See #10271 and #10210.
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]

      # Babel 8 requires Node ^22.18.0 || >=24.11.0, and every 8.x package
      # peer-depends on @babel/core ^8.0.0 whilst we are on 7.x. Taking any of
      # them individually leaves an unsatisfiable peer requirement and a mixed
      # 7/8 tree, so Babel 8 needs a coordinated migration across all ten
      # @babel/* packages once we are on Node 22. See #10283, #10284, #10285.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

      # pickr 1.10 switched to a dual CJS/ESM build whose CommonJS entry point
      # exports a namespace object rather than the class, so Babel's interop
      # leaves _pickr.default as an object and every dialog with a colour field
      # dies on mount. That took master's feature tests down for three days
      # (#10264, reverted in #10278). Note 1.9 -> 1.10 is a *minor* bump, so it
      # otherwise rejoins the grouped PR and comes back around; minor updates
      # are excluded here as well as majors until withColorPicker.js is adapted
      # to the new export shape.
      - dependency-name: "@simonwep/pickr"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
